# render.yaml
# Optional: Define your Render services as code.
# Push this file to your repo and Render will auto-detect it.

services:
  # ── Web Service (Django + Gunicorn) ──────────────────────
  - type: web
    name: ntc-travel-management
    env: python
    region: singapore          # Closest region to Nepal
    plan: free                 # Free tier (change to starter for production)
    buildCommand: "./build.sh"
    startCommand: "gunicorn ntc_travel.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true    # Render auto-generates a secure secret key
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: ntc-travel-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"

# ── PostgreSQL Database ───────────────────────────────────
databases:
  - name: ntc-travel-db
    databaseName: ntc_travel
    user: ntc_admin
    region: singapore
    plan: free                 # Free tier (90-day limit on free plan)
